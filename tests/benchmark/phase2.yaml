benchmark_version: 1
description: >
  Phase 2 acceptance — verify KG-enabled router fixes cross_document (q4) FAIL→PASS
  while preserving Phase 1 baselines on entity, multi-hop, follow-up, and out-of-corpus
  questions. Low-compute variant (5 questions, communities disabled).

questions:
  - id: q1
    category: factual_single_source
    question: "What improvement does HippoRAG 2 achieve over standard RAG in associativity tasks, and what retriever does it use by default?"
    expected_substrings:
      - "7"
      - "associativity"
      - "NV-Embed-v2"
    expected_source_doc: "2502.14802v2"
    notes: >
      HippoRAG 2 abstract (2502.14802v2.pdf, page 1) states "achieving a 7% improvement
      in associative memory tasks over the state-of-the-art embedding model". Section 4.4
      (page 6) names "nvidia/NV-Embed-v2 as the retriever". Both facts appear only in
      2502.14802v2, not in HIPPORAG.pdf or 2025.findings-naacl.30.pdf. The number "7"
      combined with "associativity" is a precise discriminator. This question is routed
      as entity/factual — exercises basic KG-PPR seed-finding without requiring cross-doc
      synthesis, confirming Phase 1 baseline is not broken by the router.

  - id: q3
    category: multi_hop
    question: "In HippoRAG, what algorithm is used during online retrieval, and what two hyperparameters were tuned using MuSiQue training data?"
    expected_substrings:
      - "Personalized PageRank"
      - "synonymy threshold"
      - "damping factor"
    expected_source_doc: "HIPPORAG"
    notes: >
      Verbatim carry-over from phase1 q3, which PASSED. HIPPORAG.pdf Section 2.2 (page 3)
      names Personalized PageRank as the online retrieval algorithm; Section 3.4 (page 6)
      states "the synonymy threshold τ at 0.8 and the PPR damping factor at 0.5" as the
      two hyperparameters tuned on MuSiQue. Neither chunk alone answers both parts, so
      the answer requires combining two passages — exactly what KG-PPR graph traversal
      is designed for. Re-using this question preserves a clean PASS-vs-PASS diff
      between phase1 and phase2 on the multi_hop dimension.

  - id: q4
    category: cross_document
    question: "Both HippoRAG and RAGate address a limitation of standard RAG. What limitation does HippoRAG address, and what limitation does RAGate address?"
    expected_substrings:
      - "knowledge integration"
      - "every turn"
    expected_source_doc: null
    notes: >
      Verbatim copy of phase1 q4 — the primary acceptance criterion for Phase 2.
      HIPPORAG.pdf abstract and introduction (pages 1-2) describe HippoRAG's goal as
      enabling "knowledge integration over new experiences" — the phrase "knowledge
      integration" is used in the figure caption (Figure 1 title: "Knowledge Integration
      & RAG") and in the body text. 2025.findings-naacl.30.pdf introduction (page 2)
      states "the necessity of augmenting every turn of the conversation with external
      knowledge remains questionable" — "every turn" is the diagnostic phrase.
      Phase 1 FAILED this question (substrings dimension) because the hybrid retriever
      returned only HippoRAG 2 chunks, missing the RAGate paper entirely. The LLM
      router's cross_document path fuses results from both papers via RRF, which should
      surface the RAGate chunk containing "every turn". FAIL→PASS here is the go/no-go
      signal for Phase 2.

  - id: q5
    category: conversational_followup
    turns:
      - "What is RAGate and what problem does it solve?"
      - "What are the three variants it uses to implement the gating function?"
    expected_substrings_per_turn:
      - ["RAGate", "gating", "external knowledge"]
      - ["RAGate-Prompt", "RAGate-PEFT", "RAGate-MHA"]
    expected_source_doc: "2025.findings-naacl.30"
    notes: >
      Verbatim carry-over from phase1 q5, which PASSED. Turn 1 asks a self-contained
      factual question answered by 2025.findings-naacl.30.pdf pages 1-2 (RAGate is a
      gating model for adaptive external knowledge augmentation). Turn 2 drops the
      subject and uses "it" and "the three variants", requiring the heuristic query
      rewriter to reconstruct "What are the three variants RAGate uses to implement the
      gating function?" before hitting the router. Pages 3-4 of 2025.findings-naacl.30.pdf
      (Section 3.2) name RAGate-Prompt, RAGate-PEFT, and RAGate-MHA explicitly.
      These three hyphenated names are unique to this paper. Re-using phase1 q5 verbatim
      confirms the rewriter still fires correctly under the router and that conversational
      context is preserved across turns.

  - id: q6
    category: out_of_corpus
    question: "What is the BLEU score achieved by HippoRAG 2 on the NarrativeQA benchmark when evaluated with a GPT-4o judge?"
    expected_substrings:
      - "couldn't find"
    expected_source_doc: null
    notes: >
      None of the three papers report a BLEU score for HippoRAG 2 on NarrativeQA with
      a GPT-4o judge. 2502.14802v2.pdf does include NarrativeQA in its evaluation suite
      (Table 2, page 7) but reports F1 scores, not BLEU, and never mentions GPT-4o as a
      judge. The question is plausible — it combines real paper entities (HippoRAG 2,
      NarrativeQA) with a plausible-sounding metric — but the specific fact is absent.
      This avoids the phase1 q6 failure mode (citation FAIL because GPU passages were
      retrieved and cited): NarrativeQA F1 passages will be found and cited, but none
      will contain a "BLEU score ... GPT-4o judge" answer, forcing the "couldn't find"
      fallback on the substring check while the citation dimension can still pass cleanly.
