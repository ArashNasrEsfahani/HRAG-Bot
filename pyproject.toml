[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrag-bot"
version = "0.1.0"
description = "Hierarchical RAG-based chatbot with growing memory and per-user personalization."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "click>=8.1",
    "tiktoken>=0.7",

    # storage
    "chromadb>=0.5",
    "networkx>=3.2",

    # embeddings + LLM clients
    "sentence-transformers>=2.7",
    "ollama>=0.3",
    "openai>=1.40",
    "anthropic>=0.34",

    # document loaders
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",

    # phase 2 (already added so requirements freeze cleanly)
    "rank_bm25>=0.2.2",
    "scipy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
graph = [
    "leidenalg>=0.10",
    "python-igraph>=0.11",
]
kg = [
    "scipy>=1.11",
    "numpy>=1.24",
    "networkx>=3.1",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "spacy>=3.7",
]
sqlite-vec = [
    "sqlite-vec>=0.1.6",
]
neo4j = [
    "neo4j>=5.0",
]
nougat = [
    "nougat-ocr>=0.1",
]
quantize = [
    "onnxruntime>=1.17",
]
openvino = [
    "openvino>=2024.0",
    "optimum[openvino]>=1.19",
]
model2vec = [
    "model2vec>=0.4",
]

[project.scripts]
hrag = "hrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrag = ["prompts/*.md", "db/*.sql", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
